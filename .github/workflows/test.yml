name: Desktop tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  desktop:
    name: Desktop unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # engines 要求 ^22.19.0 || >=24；.nvmrc 是唯一钉版来源
          node-version-file: .nvmrc
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Download Electron binary
        run: node node_modules/electron/install.js
      - name: Run desktop unit tests
        run: npm test

  # 解耦 Phase 0 望远镜：vendored 树 vs 上游 pin 的 fork 面必须被
  # harness-desktop-forks.js 登记；未登记漂移超过基线即失败（棘轮）。
  # 只读、零依赖（node + git），pin 对象缺失时从上游 fetch。
  fork-delta:
    name: Harness fork delta vs upstream pin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Classify fork delta against the registry baseline
        run: node scripts/check-harness-fork-delta.js

  vendor-gui:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Install vendor dependencies
        run: node node_modules/pnpm/bin/pnpm.cjs --dir vendor/deepseek-harness install --frozen-lockfile
      - name: Build vendor client + host libs
        run: node node_modules/pnpm/bin/pnpm.cjs --dir vendor/deepseek-harness run build:lib
      # 每次 PR 用刚构建的真实 CLI 验证 skip compose 契约（dump-config skip/full
      # 双轮 + 用户层 canary），补上 after-pack 门禁覆盖不到的 vendor PR 回归面。
      - name: Skip compose contract (real CLI dump-config)
        run: node scripts/check-skip-compose-contract.js vendor/deepseek-harness
      - name: GUI component suites
        run: node node_modules/pnpm/bin/pnpm.cjs --dir vendor/deepseek-harness run test:gui
      - name: Client catalog and notices up to date
        run: |
          node node_modules/pnpm/bin/pnpm.cjs --dir vendor/deepseek-harness run gen-client-catalog --check
          node node_modules/pnpm/bin/pnpm.cjs --dir vendor/deepseek-harness run gen-third-party-notices --check
