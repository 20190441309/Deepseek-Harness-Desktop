name: Desktop tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  desktop:
    name: Desktop unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # engines 要求 ^22.19.0 || >=24；.nvmrc 是唯一钉版来源
          node-version-file: .nvmrc
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Download Electron binary
        run: node node_modules/electron/install.js
      - name: Run desktop unit tests
        run: npm test

  vendor-gui:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Install vendor dependencies
        run: node node_modules/pnpm/bin/pnpm.cjs --dir vendor/deepseek-harness install --frozen-lockfile
      - name: Build vendor client + host libs
        run: node node_modules/pnpm/bin/pnpm.cjs --dir vendor/deepseek-harness run build:lib
      - name: GUI component suites
        run: node node_modules/pnpm/bin/pnpm.cjs --dir vendor/deepseek-harness run test:gui
      - name: Client catalog and notices up to date
        run: |
          node node_modules/pnpm/bin/pnpm.cjs --dir vendor/deepseek-harness run gen-client-catalog --check
          node node_modules/pnpm/bin/pnpm.cjs --dir vendor/deepseek-harness run gen-third-party-notices --check
