<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>手机远程</title>
  <link rel="stylesheet" href="./tokens.css" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div class="phone" id="phone">
    <section class="screen connect" id="screen-connect">
      <p class="kicker">手机远程</p>
      <h2>连接到这台电脑</h2>
      <p class="lead">扫桌面侧栏远程弹窗里的二维码。密钥在 #offer=，不会进查询串。</p>
      <div class="device" id="device-line"><span class="live"></span>等待配对</div>
      <p class="error hidden" id="connect-error"></p>
      <button class="primary-btn" type="button" id="enter">进入会话</button>
      <input class="paste" id="paste" type="url" placeholder="https://relay.example/#offer=…" autocomplete="off" />
      <button class="ghost-btn" type="button" id="paste-enter">用链接连接</button>
    </section>

    <section class="screen chat hidden" id="screen-chat">
      <button class="phone-menu" type="button" id="menu" aria-label="打开会话列表">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 4.5h10M3 8h10M3 11.5h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
      <header class="header">
        <h2 class="title" id="chat-title">新会话</h2>
        <p class="meta">Deepseek-Harness-Desktop<span class="run hidden" id="run-flag">运行中</span></p>
      </header>
      <div class="log" id="log"></div>
      <div class="blank" id="blank">
        <h2>新会话</h2>
        <p class="lead">描述你想要构建的内容。工作区仍是电脑上的那一个。</p>
      </div>
      <div class="composer-root">
        <form class="composer" id="composer">
          <textarea id="draft" rows="2" placeholder="给智能体发消息"></textarea>
          <div class="composer-row">
            <button class="send" type="submit" aria-label="发送消息">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          </div>
        </form>
        <div class="approval hidden" id="approval">
          <div class="strip"><span class="dot"></span>等待审批</div>
          <div class="approval-body">
            <p class="headline" id="approval-title">需要审批</p>
            <p class="command" id="approval-command"></p>
          </div>
          <div class="action-row">
            <button class="ghost-btn" type="button" id="approval-reject">拒绝</button>
            <button class="primary-btn" type="button" id="approval-allow">允许一次</button>
          </div>
        </div>
      </div>
    </section>

    <button class="backdrop hidden" type="button" id="backdrop" aria-label="关闭会话列表"></button>
    <aside class="drawer" id="drawer">
      <input class="search" id="search" type="search" placeholder="搜索会话" />
      <button class="new-session" type="button" id="new-session">新会话</button>
      <p class="ws" id="workspace-line">Deepseek-Harness-Desktop</p>
      <div class="session-list" id="session-list"></div>
      <button class="drawer-foot" type="button" id="open-settings">设置</button>
    </aside>

    <section class="settings hidden" id="settings" aria-label="设置">
      <div class="set-head">
        <h2>设置</h2>
        <button class="icon-btn" type="button" id="close-settings" aria-label="关闭">×</button>
      </div>
      <nav class="set-nav" id="set-nav"></nav>
      <div class="options" id="options"></div>
    </section>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
